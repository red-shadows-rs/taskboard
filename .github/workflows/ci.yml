# ─────────────────────────────────────────────
# Taskboard - CI Workflow
# https://github.com/red-shadows-rs/taskboard
# ─────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SESSION_SECRET: ci-build-session-secret-not-used-at-runtime

jobs:
  check:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ── Toolchain ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Policy & Consistency ──
      - name: Enforce code comment policy
        run: ./scripts/check-comments.sh
      - name: Check version consistency
        run: ./scripts/check-versions.sh

      # ── Quality Gates ──
      - name: Quality & Policy Check
        run: npm run check

      # ── Build ──
      - name: Build
        run: npm run build

      # ── Security Audit ──
      - name: Security audit
        run: npm audit --omit=dev
        continue-on-error: true
