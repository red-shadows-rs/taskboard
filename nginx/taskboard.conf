# ─────────────────────────────────────────────
# TaskBoard - Nginx Reverse Proxy Configuration
# https://github.com/red-shadows-rs/taskboard
# ─────────────────────────────────────────────

# ── Rate Limiting Zone ──
limit_req_zone $binary_remote_addr zone=taskboard_public:10m rate=30r/m;

# ── HTTP to HTTPS Redirect ──
server {
  listen 80;
  listen [::]:80;
  server_name taskboard.example.com;
  return 301 https://$host$request_uri;
}

# ── HTTPS Server ──
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name taskboard.example.com;

  ssl_certificate     /etc/nginx/certs/taskboard.crt;
  ssl_certificate_key /etc/nginx/certs/taskboard.key;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 25m;

  location ~ ^/(api/auth/login|demo) {
    limit_req zone=taskboard_public burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/taskboard-proxy.conf;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/taskboard-proxy.conf;
  }
}
